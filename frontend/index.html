<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>荷玛诗国际花园 · 用电充值监控</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // 首屏前应用主题（与 src/composables/useTheme.js 保持一致），避免闪烁
      // 三档偏好：light | dark | system；system 或未设置时按系统偏好，兜底亮色
      (function () {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.dataset.theme = t;
      })();
      // 首屏前应用语言（与 src/i18n/index.js 保持一致），避免 <html lang> 闪烁
      (function () {
        var l = localStorage.getItem("locale");
        if (l !== "zh-CN" && l !== "en-US") {
          l =
            (navigator.language || "zh-CN").toLowerCase().indexOf("zh") === 0
              ? "zh-CN"
              : "en-US";
        }
        document.documentElement.lang = l;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
